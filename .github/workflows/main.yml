name: main

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb
        options: >-
          --health-cmd "pg_isready -U postgres -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://postgres:password@localhost:5432/appdb
      APP_URL: http://localhost:8080
      PORT: 8080
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: make install
      - run: make build
      - run: make lint
      - run: npx playwright install --with-deps chromium
      - run: make test-api

      - name: Start application
        run: |
          mkdir -p tmp
          nohup make start > tmp/app.log 2>&1 &
          timeout 60 bash -c 'until curl -sf "$APP_URL/api/health" >/dev/null; do sleep 1; done'

      # TODO: remove continue-on-error once the auth/orders API is implemented
      # and the full Hexlet browser suite is green.
      - name: Browser tests (expected failures until API is implemented)
        continue-on-error: true
        run: make test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: tmp/artifacts
          if-no-files-found: ignore

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: tmp/app.log
          if-no-files-found: ignore
